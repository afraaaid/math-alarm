name: Build Sveglia IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compila IPA iOS su Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifica utility di sistema preinstallate
        run: |
          for cmd in curl unzip tar xz zip python3 file; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "Manca comando: $cmd"; exit 1; }
          done
          python3 --version

      - name: Scarica Toolchain iOS Linux (Clang + ld64 + ldid) e iOS SDK
        run: |
          mkdir -p toolchain sdks
          curl -fSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" -o toolchain.tar.xz
          tar -xJf toolchain.tar.xz -C toolchain
          rm -f toolchain.tar.xz

          curl -fSL "https://github.com/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip -d sdks_tmp
          mv sdks_tmp/sdks-master/*.sdk sdks/
          rm -rf sdks.zip sdks_tmp

          echo "Contenuto toolchain (bin):"
          find toolchain -maxdepth 5 -path "*/bin/*" | head -n 60
          echo "SDK disponibili:"
          ls -d sdks/iPhoneOS*.sdk

      - name: Genera suonerie WAV e icone PNG
        run: |
          python3 scripts/generate_sounds.py
          python3 scripts/generate_icon.py

      - name: Prepara compat_libs e compila binario arm64-apple-ios (Release)
        run: |
          CLANG_BIN=$(find -L toolchain -type f -name "clang" | head -n 1 || true)
          if [ -z "$CLANG_BIN" ]; then
            CLANG_BIN=$(find -L toolchain -type f \( -name "clang-[0-9]*" -o -name "*apple-darwin*-clang" \) | head -n 1 || true)
          fi
          if [ -z "$CLANG_BIN" ]; then
            echo "Errore: clang non trovato nella toolchain"
            find toolchain -maxdepth 5
            exit 1
          fi

          TOOLCHAIN_BIN_DIR=$(dirname "$CLANG_BIN")
          TOOLCHAIN_ROOT=$(dirname "$TOOLCHAIN_BIN_DIR")
          SDK_PATH=$(ls -d sdks/iPhoneOS*.sdk | sort -V | tail -n 1)
          if [ -z "$SDK_PATH" ]; then
            echo "Errore: nessun iPhoneOS SDK trovato"
            exit 1
          fi

          if [ ! -e "$TOOLCHAIN_BIN_DIR/ld" ]; then
            MACH_LD=$(find -L "$TOOLCHAIN_BIN_DIR" -maxdepth 1 -type f \( -name "*apple-darwin*-ld" -o -name "ld64" -o -name "ld64.lld" \) | head -n 1 || true)
            if [ -n "$MACH_LD" ]; then
              echo "Collego linker Mach-O: ld -> $(basename "$MACH_LD")"
              ln -sf "$(basename "$MACH_LD")" "$TOOLCHAIN_BIN_DIR/ld"
            fi
          fi

          COMPAT_DIR="$PWD/compat_libs"
          mkdir -p "$COMPAT_DIR"
          TOOLCHAIN_LIB_DIR="$TOOLCHAIN_ROOT/lib"

          export LD_LIBRARY_PATH="$TOOLCHAIN_LIB_DIR:$COMPAT_DIR:${LD_LIBRARY_PATH:-}"
          for bin in "$TOOLCHAIN_BIN_DIR"/*; do
            [ -x "$bin" ] && [ ! -d "$bin" ] || continue
            while IFS= read -r missing_so; do
              [ -n "$missing_so" ] || continue
              base_name="${missing_so%%.so*}"
              candidate=$(find /lib/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu "$TOOLCHAIN_LIB_DIR" -maxdepth 2 -name "${base_name}.so*" 2>/dev/null | head -n 1 || true)
              if [ -n "$candidate" ] && [ ! -e "$COMPAT_DIR/$missing_so" ]; then
                echo "Creo symlink compatibilità: $missing_so -> $candidate"
                ln -sf "$candidate" "$COMPAT_DIR/$missing_so"
              fi
            done < <(ldd "$bin" 2>/dev/null | awk '/not found/ {print $1}' || true)
          done

          echo "COMPAT_LD_PATH=$TOOLCHAIN_LIB_DIR:$COMPAT_DIR" >> "$GITHUB_ENV"

          echo "Uso compiler: $CLANG_BIN"
          echo "Uso toolchain dir: $TOOLCHAIN_BIN_DIR"
          echo "Uso SDK: $SDK_PATH"
          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          "$CLANG_BIN" --version

          mkdir -p ipa_work/Payload/Sveglia.app

          "$CLANG_BIN" \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -B"$TOOLCHAIN_BIN_DIR" \
            -fobjc-arc \
            -O2 \
            -Wall \
            -framework CoreFoundation \
            -framework CoreGraphics \
            -framework Foundation \
            -framework UIKit \
            -framework AVFoundation \
            -framework MediaPlayer \
            -framework UserNotifications \
            -framework QuartzCore \
            ios_objc/Models.m \
            ios_objc/AlarmEngine.m \
            ios_objc/Views.m \
            ios_objc/main.m \
            -o ipa_work/Payload/Sveglia.app/Sveglia

          file ipa_work/Payload/Sveglia.app/Sveglia

      - name: Impacchetta risorse, firma ad-hoc con ldid e crea Sveglia.ipa
        run: |
          export LD_LIBRARY_PATH="${COMPAT_LD_PATH:-}:${LD_LIBRARY_PATH:-}"
          cp Sveglia/Info.plist ipa_work/Payload/Sveglia.app/Info.plist
          cp Sveglia/Resources/Sounds/*.wav ipa_work/Payload/Sveglia.app/
          cp Sveglia/Resources/Icons/*.png ipa_work/Payload/Sveglia.app/

          python3 -c '
          import plistlib
          with open("ipa_work/Payload/Sveglia.app/Info.plist", "rb") as f:
              plistlib.load(f)
          print("Info.plist valido")
          '

          LDID_BIN=$(find -L toolchain -type f -name "ldid" | head -n 1 || true)
          if [ -n "$LDID_BIN" ]; then
            echo "Applico firma ad-hoc con $LDID_BIN"
            "$LDID_BIN" -S ipa_work/Payload/Sveglia.app/Sveglia
          else
            echo "Avviso: ldid non trovato, continuo con binario non firmato (SideStore/AltStore/Sideloadly firmeranno durante il sideload)"
          fi

          cd ipa_work
          zip -qry ../Sveglia.ipa Payload
          cd ..
          ls -lh Sveglia.ipa

      - name: Carica artifact Sveglia.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Sveglia-iOS-IPA
          path: Sveglia.ipa
          retention-days: 30
