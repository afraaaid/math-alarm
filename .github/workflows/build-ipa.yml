name: Build Sveglia IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compila IPA iOS su Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils zip python3 libxml2 zlib1g

      - name: Scarica Toolchain iOS Linux (Clang + ld64 + ldid) e iOS SDK
        run: |
          mkdir -p toolchain sdks
          curl -fSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" -o toolchain.tar.xz
          tar -xJf toolchain.tar.xz -C toolchain
          rm -f toolchain.tar.xz

          curl -fSL "https://github.com/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip -d sdks_tmp
          mv sdks_tmp/sdks-master/*.sdk sdks/
          rm -rf sdks.zip sdks_tmp

          echo "Contenuto toolchain:"
          find toolchain -maxdepth 4 -type f \( -name "clang" -o -name "ldid" -o -name "ld*" \)
          echo "SDK disponibili:"
          ls -d sdks/iPhoneOS*.sdk

      - name: Genera suonerie WAV e icone PNG
        run: |
          python3 scripts/generate_sounds.py
          python3 scripts/generate_icon.py

      - name: Compila binario arm64-apple-ios (Release)
        run: |
          CLANG_BIN=$(find toolchain -type f -name "clang" | head -n 1)
          if [ -z "$CLANG_BIN" ]; then
            echo "Errore: clang non trovato nella toolchain"
            exit 1
          fi
          TOOLCHAIN_BIN_DIR=$(dirname "$CLANG_BIN")
          SDK_PATH=$(ls -d sdks/iPhoneOS*.sdk | sort -V | tail -n 1)
          if [ -z "$SDK_PATH" ]; then
            echo "Errore: nessun iPhoneOS SDK trovato"
            exit 1
          fi

          echo "Uso compiler: $CLANG_BIN"
          echo "Uso toolchain dir: $TOOLCHAIN_BIN_DIR"
          echo "Uso SDK: $SDK_PATH"
          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          ls -la "$TOOLCHAIN_BIN_DIR"

          mkdir -p ipa_work/Payload/Sveglia.app

          "$CLANG_BIN" \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -B"$TOOLCHAIN_BIN_DIR" \
            -fobjc-arc \
            -O2 \
            -Wall \
            -framework Foundation \
            -framework UIKit \
            -framework AVFoundation \
            -framework MediaPlayer \
            -framework UserNotifications \
            -framework QuartzCore \
            ios_objc/Models.m \
            ios_objc/AlarmEngine.m \
            ios_objc/Views.m \
            ios_objc/main.m \
            -o ipa_work/Payload/Sveglia.app/Sveglia

          file ipa_work/Payload/Sveglia.app/Sveglia

      - name: Impacchetta risorse, firma ad-hoc con ldid e crea Sveglia.ipa
        run: |
          cp Sveglia/Info.plist ipa_work/Payload/Sveglia.app/Info.plist
          cp Sveglia/Resources/Sounds/*.wav ipa_work/Payload/Sveglia.app/
          cp Sveglia/Resources/Icons/*.png ipa_work/Payload/Sveglia.app/

          python3 -c '
          import plistlib
          with open("ipa_work/Payload/Sveglia.app/Info.plist", "rb") as f:
              plistlib.load(f)
          print("Info.plist valido")
          '

          LDID_BIN=$(find toolchain -type f -name "ldid" | head -n 1 || true)
          if [ -n "$LDID_BIN" ]; then
            echo "Applico firma ad-hoc con $LDID_BIN"
            "$LDID_BIN" -S ipa_work/Payload/Sveglia.app/Sveglia
          else
            echo "Avviso: ldid non trovato, continuo con binario non firmato (SideStore/AltStore/Sideloadly firmeranno durante il sideload)"
          fi

          cd ipa_work
          zip -qry ../Sveglia.ipa Payload
          cd ..
          ls -lh Sveglia.ipa

      - name: Carica artifact Sveglia.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Sveglia-iOS-IPA
          path: Sveglia.ipa
          retention-days: 30
